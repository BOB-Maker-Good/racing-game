<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDLINE: NIGHTFALL</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#03050b;color:white;font-family:Arial,sans-serif}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;padding:20px;box-sizing:border-box}.top{display:flex;justify-content:space-between;font-weight:900;font-size:18px}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#080c18dd;border:1px solid #53e9ff66;border-radius:20px;padding:35px;pointer-events:auto;box-shadow:0 20px 80px #000}.panel h1{font-size:clamp(38px,8vw,76px);font-style:italic;margin:0 0 10px}.panel p{opacity:.65}.btn{background:#12384b;color:white;border:1px solid #54eaff88;border-radius:12px;padding:14px 22px;font-weight:900;cursor:pointer}.hide{display:none}.touch{display:none}@media(max-width:700px){.touch{display:flex;position:fixed;bottom:15px;left:10px;right:10px;justify-content:space-between;pointer-events:none}.touch button{pointer-events:auto;background:#071522cc;color:white;border:1px solid #55eaff55;border-radius:12px;padding:15px;font-weight:900}}</style></head><body><div id="ui"><div class="top"><span id="lap">LAP 1/3</span><span id="speed">0 KM/H</span><span id="pos">P1/9</span></div><div id="menu" class="panel"><h1>REDLINE<br>NIGHTFALL</h1><p>PROCEDURAL 3D RACING</p><button id="start" class="btn">START RACE</button></div><div id="finish" class="panel hide"><h1 id="result">FINISH</h1><button id="again" class="btn">RACE AGAIN</button></div></div><div class="touch"><button data-k="left">◀</button><button data-k="brake">BRAKE</button><button data-k="go">GO</button><button data-k="right">▶</button><button data-k="boost">BOOST</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">
import * as T from 'three';
const scene=new T.Scene();scene.background=new T.Color(0x050713);scene.fog=new T.FogExp2(0x050713,.002);
const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,1200);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0x9abfff,0x080808,1.8));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(100,150,50);scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(900,900),new T.MeshStandardMaterial({color:0x070b12,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const N=140,pts=[];for(let i=0;i<N;i++){let a=i/N*Math.PI*2,r=105+14*Math.sin(2*a)+8*Math.sin(5*a);pts.push(new T.Vector3(Math.cos(a)*r*1.3,0,Math.sin(a)*r))}
for(let pass=0;pass<3;pass++){let c=pts.map(p=>p.clone());for(let i=0;i<N;i++)pts[i].lerpVectors(c[(i-1+N)%N],c[(i+1)%N],.5).lerp(c[i],.5)}
const road=new T.Group();scene.add(road);for(let i=0;i<N;i++){let a=pts[i],b=pts[(i+1)%N],m=a.clone().add(b).multiplyScalar(.5),d=b.clone().sub(a),len=d.length(),q=new T.Mesh(new T.BoxGeometry(13,.2,len+1),new T.MeshStandardMaterial({color:0x111722,roughness:.9}));q.position.copy(m);q.rotation.y=Math.atan2(d.x,d.z);road.add(q);let l=new T.Mesh(new T.BoxGeometry(.12,.04,len*.35),new T.MeshBasicMaterial({color:0x46eaff}));l.position.copy(m);l.position.y=.13;l.rotation.y=q.rotation.y;road.add(l)}
for(let i=0;i<45;i++){let a=Math.random()*Math.PI*2,r=150+Math.random()*120,h=8+Math.random()*40,b=new T.Mesh(new T.BoxGeometry(7+Math.random()*10,h,7+Math.random()*10),new T.MeshStandardMaterial({color:0x101a30,metalness:.4}));b.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);road.add(b)}
function car(color){let g=new T.Group(),m=new T.MeshStandardMaterial({color,metalness:.75,roughness:.22}),dark=new T.MeshStandardMaterial({color:0x05070a});let body=new T.Mesh(new T.BoxGeometry(1.9,.65,4.4),m);body.position.y=.7;g.add(body);let cab=new T.Mesh(new T.BoxGeometry(1.45,.6,1.7),new T.MeshStandardMaterial({color:0x172b3b,transparent:true,opacity:.8}));cab.position.set(0,1.12,.35);g.add(cab);for(let x of[-1,1])for(let z of[-1.5,1.5]){let w=new T.Mesh(new T.CylinderGeometry(.34,.34,.25,16),dark);w.rotation.z=Math.PI/2;w.position.set(x,.4,z);g.add(w)}scene.add(g);return g}
const player=car(0x2ee8ff), rivals=[];for(let i=0;i<8;i++)rivals.push(car([0xff315d,0xffa43a,0x9a5cff,0x50ff75][i%4]));
let lap=1,progress=0,running=false,keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
function place(o,i){let p=pts[(2+i*3)%N],n=pts[(3+i*3)%N].clone().sub(p).normalize(),s=new T.Vector3(-n.z,0,n.x);o.position.copy(p).addScaledVector(s,(i%2?3:-3));o.position.y=.75;o.rotation.y=Math.atan2(n.x,n.z)}
place(player,0);rivals.forEach((r,i)=>place(r,i+1));
let speed=0,heading=0,lastI=2;function update(dt){if(!running)return;let throttle=keys.KeyW||keys.ArrowUp,brake=keys.KeyS||keys.ArrowDown,steer=(keys.KeyA||keys.ArrowLeft?-1:0)+(keys.KeyD||keys.ArrowRight?1:0);speed+=((throttle?22:0)-(brake?30:0)-speed*.22)*dt;if(keys.ShiftLeft||keys.ShiftRight)speed+=35*dt;speed=Math.max(0,Math.min(29,speed));heading-=steer*1.7*dt*(.3+speed/29);player.rotation.y=heading;player.position.x+=-Math.sin(heading)*speed*dt;player.position.z+=-Math.cos(heading)*speed*dt;let best=0,bd=1e9;for(let i=0;i<N;i++){let d=player.position.distanceToSquared(pts[i]);if(d<bd){bd=d;best=i}}if(best<lastI-60)lap++;lastI=best;progress=best/N;document.querySelector('#lap').textContent=`LAP ${Math.min(lap,3)}/3`;document.querySelector('#speed').textContent=`${Math.round(speed*3.6)} KM/H`;let f=pts[(best+8)%N];camera.position.lerp(player.position.clone().add(new T.Vector3(0,5,12)),.08);camera.lookAt(player.position.clone().lerp(f,.35));rivals.forEach((r,i)=>{let idx=Math.floor((performance.now()/80)*(0.12+i*.003)+i*17)%N;r.position.lerp(pts[idx].clone().setY(.75),.02);let nn=pts[(idx+1)%N].clone().sub(pts[idx]).normalize();r.rotation.y=Math.atan2(nn.x,nn.z)});if(lap>3){running=false;document.querySelector('#result').textContent='CHECKERED FLAG';document.querySelector('#finish').classList.remove('hide')}}
document.querySelector('#start').onclick=()=>{running=true;document.querySelector('#menu').classList.add('hide')};document.querySelector('#again').onclick=()=>location.reload();
document.querySelectorAll('.touch button').forEach(b=>{let k=b.dataset.k,down=e=>{e.preventDefault();if(k==='go')keys.KeyW=true;if(k==='brake')keys.KeyS=true;if(k==='left')keys.KeyA=true;if(k==='right')keys.KeyD=true;if(k==='boost')keys.ShiftLeft=true},up=e=>{e.preventDefault();if(k==='go')keys.KeyW=false;if(k==='brake')keys.KeyS=false;if(k==='left')keys.KeyA=false;if(k==='right')keys.KeyD=false;if(k==='boost')keys.ShiftLeft=false};b.onpointerdown=down;b.onpointerup=up;b.onpointercancel=up});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let clock=new T.Clock();function loop(){requestAnimationFrame(loop);update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera)}loop();
</script></body></html>
